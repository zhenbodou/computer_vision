name: Deploy mdBook to GitHub Pages

on:
  # 每次推送到 main 分支自动部署
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署 Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署；让正在进行的部署跑完，不中途取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 与本地作者使用的版本保持一致，保证产物完全相同
      MDBOOK_VERSION: "0.5.3"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 mdBook（预编译二进制，秒级）
        run: |
          mkdir -p "$HOME/.mdbook"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory="$HOME/.mdbook"
          echo "$HOME/.mdbook" >> "$GITHUB_PATH"

      - name: 构建电子书
        env:
          # 项目页部署在 https://zhenbodou.github.io/computer_vision/ 子路径下。
          # 仅在 CI 注入此变量，本地 `mdbook serve` 不受影响，仍可从根路径预览。
          MDBOOK_OUTPUT__HTML__SITE_URL: "/computer_vision/"
        run: mdbook build

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
