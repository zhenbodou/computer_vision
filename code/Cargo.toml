[package]
name = "cv_examples"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25.10"
imageproc = "0.27.0"
nalgebra = "0.35.0"
ndarray = "0.17.2"
rustfft = "6.4.1"
rayon = "1.12.0"       # 第 108 章：纯 Rust 数据并行（par_iter / par_chunks）
thiserror = "2.0.20"   # 第 112 章：库层自定义错误枚举
anyhow = "1.0.104"     # 第 112 章：应用层错误处理
serde = { version = "1.0.229", features = ["derive"] }  # 第 113 章：COCO 标注 JSON 解析
serde_json = "1.0.151"                                  # 第 113 章：serde_json 解析/序列化

[dev-dependencies]
criterion = "0.8.2"    # 第 108 章：统计学基准测试（cargo bench）

[[bench]]
name = "ch108_bench"
harness = false
